name: Release Muzen Cursor Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension Bundle
        run: npm run build

      - name: Package Dist into Zip
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          ZIP_NAME="muzen-cursor-${VERSION}.zip"
          cd dist && zip -r "../${ZIP_NAME}" ./* && cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          name: Muzen Cursor ${{ github.ref_name || github.event.inputs.tag_name }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
          body: |
            ## 📦 安裝指南 / Installation Guide

            ### 繁體中文
            1. 下載下方 Assets 中的 **`muzen-cursor-${{ github.ref_name || github.event.inputs.tag_name }}.zip`** 壓縮檔並解壓縮至本機資料夾。
            2. 開啟 Chromium 核心瀏覽器（Google Chrome、Microsoft Edge、Brave 等）：
               - Chrome：於網址列輸入 `chrome://extensions/`
               - Edge：於網址列輸入 `edge://extensions/`
            3. 開啟右上角 **「開發人員模式 (Developer mode)」**。
            4. 點選左上角 **「載入未封裝項目 (Load unpacked)」**，選取剛剛解壓縮後的資料夾。
            5. 安裝完成！前往任意網頁點擊文字即可開始沉浸式閱讀體驗（快捷鍵 <kbd>Alt</kbd> + <kbd>V</kbd> 可快速切換啟動／凍結）。

            ---

            ### English
            1. Download **`muzen-cursor-${{ github.ref_name || github.event.inputs.tag_name }}.zip`** from the Assets section below and extract it to a local folder.
            2. Open your Chromium-based browser (Chrome, Edge, Brave, etc.):
               - Chrome: Navigate to `chrome://extensions/`
               - Edge: Navigate to `edge://extensions/`
            3. Enable **"Developer mode"** in the top-right corner.
            4. Click **"Load unpacked"** in the top-left corner and select the extracted folder.
            5. Ready! Visit any webpage and click on any text to start reading (press <kbd>Alt</kbd> + <kbd>V</kbd> to toggle the cursor).

