name: Release Muzen Cursor Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension Bundle
        run: npm run build

      - name: Package Dist into Zip
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          ZIP_NAME="muzen-cursor-${VERSION}.zip"
          cd dist && zip -r "../${ZIP_NAME}" ./* && cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          name: Muzen Cursor ${{ github.ref_name || github.event.inputs.tag_name }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          draft: false
          prerelease: false
