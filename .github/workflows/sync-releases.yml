name: Sync All Changelogs to GitHub Releases

on:
  workflow_dispatch: # 支援在 GitHub 網頁上手動一鍵點擊執行
  push:
    paths:
      - 'CHANGELOG.md'
      - '.github/workflows/sync-releases.yml'
      - 'scripts/sync-all-releases.mjs'
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-releases:
    name: Sync All Releases Changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync All Releases from CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/sync-all-releases.mjs
